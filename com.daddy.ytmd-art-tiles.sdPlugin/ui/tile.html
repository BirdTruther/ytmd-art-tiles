<!DOCTYPE html>
<html>
<head lang="en">
	<meta charset="utf-8" />
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Grid size">
		<sdpi-select setting="grid" default="2">
			<option value="2">2 x 2</option>
			<option value="3">3 x 3</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Row">
		<sdpi-select setting="row" default="1">
			<option value="1">Top</option>
			<option value="2">Middle (or bottom in 2 x 2)</option>
			<option value="3">Bottom (3 x 3)</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Column">
		<sdpi-select setting="col" default="1">
			<option value="1">Left</option>
			<option value="2">Middle (or right in 2 x 2)</option>
			<option value="3">Right (3 x 3)</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item>
		<p>On first run, click Allow in the YouTube Music Desktop pop-up.</p>
	</sdpi-item>
</body>
</html>
